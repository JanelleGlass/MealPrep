# Fly.io config for MealPrep.
# SQLite lives on a persistent volume mounted at /data, so this app must
# run as a single machine (volumes pin to one machine).

app = "mealprep-janelle"
primary_region = "sea"

[build]

[env]
  MEALPREP_DATA_DIR = "/data"

[mounts]
  source = "mealprep_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
